<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Калькулятор возраста</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00c6ff;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Калькулятор возраста</h2>

        <input type="number" id="year" placeholder="Введите год рождения">

        <button onclick="calcAge()">Рассчитать</button>

        <p id="result"></p>
    </div>

    <script>
        function calcAge() {
            let year = document.getElementById("year").value;

            if (year === "") {
                document.getElementById("result").innerHTML = "Введите год!";
                return;
            }

            let age = 2026 - year;

            document.getElementById("result").innerHTML = "Ваш возраст: " + age + " лет";
        }
    </script>
</body>
</html>
